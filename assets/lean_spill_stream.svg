<svg width='56' height='1800' viewBox='0 0 56 1800' style='overflow:visible;'>

      <defs>
        <!-- Translucent viscous syrup 3D linear gradient -->
        <linearGradient id="leanUnifiedG" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#3b0764"/>
          <stop offset="15%" stop-color="#7e22ce"/>
          <stop offset="35%" stop-color="#a855f7"/>
          <stop offset="50%" stop-color="#d946ef"/>
          <stop offset="65%" stop-color="#ff3afc"/>
          <stop offset="85%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#3b0764"/>
        </linearGradient>

        <!-- Spherical specular droplet gradient -->
        <radialGradient id="leanSphereG" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#ff66fd"/>
          <stop offset="60%" stop-color="#c026d3"/>
          <stop offset="85%" stop-color="#7e22ce"/>
          <stop offset="100%" stop-color="#3b0764"/>
        </radialGradient>

        <!-- Ultraviolet neon aura blur -->
        <filter id="leanGlowUnified" x="-50%" y="-15%" width="200%" height="130%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    
